services:
  postgres:
    image: postgres:16-alpine
    container_name: itx-revenue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: itx_revenue
    ports:
      - "5433:5432"
    volumes:
      - itx_revenue_data:/var/lib/postgresql/data

volumes:
  itx_revenue_data:
